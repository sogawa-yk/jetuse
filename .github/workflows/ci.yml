name: ci

on:
  push:
    # 4ブランチ体制(ADR-0028): main=Public 安定 / public-dev=Public 統合
    # internal-dev=Internal 統合 / internal-stable=Internal 安定
    branches: [main, public-dev, internal-dev, internal-stable]
  pull_request:

# **既定の権限を読み取りだけにする。** OSS ではフォークからの PR が任意のコードを持ち込む。
# 既定のままだと `GITHUB_TOKEN` が書き込み可のリポジトリがあり、ワークフローを踏み台に
# リポジトリを書き換えられる。ci は検査しかしないので `contents: read` で足りる。
# 追加の権限が要るジョブが出たら、そのジョブにだけ書く（ここは広げない）。
permissions:
  contents: read

# **同じ PR の古い実行を止める。** 連続で push したとき、古い実行が最後まで走って
# runner を占有し、結果の解釈も紛らわしくなる。main など長期ブランチは打ち切らない
# （リリース判断の材料になるため）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  branch-base:
    # 共有物を internal 側の枝に入れると Public へ届かず両系統が乖離する(2026-07 の実害)。
    # 規律だけでは再発するので機械で止める。判定の実体は ops/check-branch-base.sh。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 既定の浅い checkout だと merge-base が取れず、検査が丸ごとスキップされる
          fetch-depth: 0
      - name: check branch base
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: ops/check-branch-base.sh

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      # **dist はもう追跡しない**（2026-08-22 / OSS 化）。以前は「コミット済み dist と
      # 一致するか」を見ていたが、**ビルド出力は環境で一致しない** —— macOS と CI(Linux)
      # でチャンクのハッシュが変わり、ソースを1文字も違えていなくても落ちる。実際この方式で
      # CI が5回落ちた。外部の貢献者は環境を揃えられないため、OSS では貢献の入口を塞ぐ。
      # 「配布物として組み立てられるか」は terraform ジョブが見る（そちらが zip を作るため）。

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - name: fmt
        run: terraform fmt -check -recursive infra
      - name: validate dev
        working-directory: infra/terraform/environments/dev
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: validate orm (ワンクリックスタック)
        working-directory: infra/orm
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: test public IAM policy contract
        working-directory: infra/terraform/modules/iam
        run: |
          terraform init -backend=false -input=false
          terraform test
      - name: test hosted agent module contract
        working-directory: infra/terraform/modules/hosted-agent
        run: |
          terraform init -backend=false -input=false
          terraform test
      - name: test hosted agent CLI scripts
        # terraform test は local-exec を実行しないので、シェル側の判断はモックで確認する
        run: sh infra/terraform/modules/hosted-agent/scripts/smoke_test.sh
      # **zip は SPA の dist を同梱する。** dist は追跡しないので、ここで作る。
      # 以前は追跡された dist をそのまま使えたが、ビルド出力が環境で一致しない問題で
      # 貢献の入口を塞いでいた（上の web ジョブのコメント参照）。
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/web/package-lock.json
      - name: Build SPA (zip の同梱物)
        working-directory: packages/web
        run: |
          npm ci
          npm run build
      - name: Build Deploy to OCI archive
        run: bash scripts/package-orm-stacks.sh "$RUNNER_TEMP/orm-packages"
      - name: Validate packaged JetUse stack
        run: |
          mkdir -p "$RUNNER_TEMP/orm-app"
          unzip -q "$RUNNER_TEMP/orm-packages/jetuse-orm.zip" -d "$RUNNER_TEMP/orm-app"
          test -f "$RUNNER_TEMP/orm-app/schema.yaml"
          test -f "$RUNNER_TEMP/orm-app/main.tf"
          grep -q '^  enable_dynamic_group:' "$RUNNER_TEMP/orm-app/schema.yaml"
          grep -q '^  enable_runtime_policy:' "$RUNNER_TEMP/orm-app/schema.yaml"
          terraform -chdir="$RUNNER_TEMP/orm-app" init -backend=false -input=false
          terraform -chdir="$RUNNER_TEMP/orm-app" validate
